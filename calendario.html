<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light only">
<title>DIMAYOR · Partidos de la Semana</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     DISEÑO FIJO PARA PANTALLA 1920 x 1080 (Full HD)
     ========================================================= */
  :root{
    color-scheme: light only;
    --navy-900:#03122b;
    --navy-800:#061d40;
    --navy-700:#0a2a5c;
    --blue:#0063cc;
    --blue-dark:#004c99;
    --sky:#d1d5db;   /* indicador de páginas en gris claro */
    --gold:#f3cc23;
    --white:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --live:#e11d48;
    --live-soft:#ffe4ea;
    --done:#475569;
    --done-soft:#eef1f5;
    --page-seconds:10s;
  }
  *{ box-sizing:border-box; }
  html,body{
    width:100%; height:100%; margin:0; padding:0; overflow:hidden;
    font-family:'DM Sans', sans-serif; color:var(--white);
    /* Fondo negro (casi negro, más suave en pantalla que el negro puro) con un leve brillo gris */
    background:
      radial-gradient(900px 500px at 8% -10%, rgba(255,255,255,.06), transparent 65%),
      linear-gradient(180deg, #0d0f14, #050608);
  }
  /* El diseño se arma en 1920x1080 y se escala completo para llenar cualquier pantalla
     (720p, 1080p, 4K, portátil, TV, etc.) sin deformarse ni cortar nada. */
  /* El diseño se arma en 1920x1080 y se escala completo para llenar la pantalla donde se reproduzca */
  #stage{
    position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform-origin:center center;
    transform:translate(-50%, -50%) scale(var(--k, 1));
  }
  .board{ width:100%; height:100%; display:flex; flex-direction:column; }

  /* ---------- Encabezado ---------- */
  header{
    height:96px; flex:0 0 96px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 40px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand{ display:flex; align-items:center; gap:22px; }
  .brand img{ height:46px; }
  .brand .sep{ width:2px; height:44px; background:rgba(255,255,255,.18); border-radius:2px; }
  .brand .t1{ font-size:30px; font-weight:800; letter-spacing:.01em; line-height:1.05; }
  .brand .t2{ font-size:15px; color:rgba(255,255,255,.6); margin-top:4px; letter-spacing:.04em; text-transform:uppercase; }
  .headRight{ display:flex; align-items:center; gap:28px; }
  .livePill{
    display:none; align-items:center; gap:10px;
    background:var(--live); color:#fff; font-weight:800; font-size:17px; letter-spacing:.06em;
    padding:9px 18px; border-radius:30px; text-transform:uppercase;
    box-shadow:0 0 0 0 rgba(225,29,72,.6); animation:pillPulse 2s infinite;
  }
  .livePill.show{ display:flex; }
  .livePill .dot{ width:10px; height:10px; border-radius:50%; background:#fff; animation:blink 1s infinite; }
  .clock{ text-align:right; }
  .clock .time{ font-family:'DM Mono', monospace; font-size:38px; font-weight:500; line-height:1; }
  .clock .date{ font-size:15px; color:rgba(255,255,255,.65); margin-top:6px; }

  /* ---------- Columnas de días ---------- */
  main{
    height:940px; flex:0 0 940px;
    display:grid; grid-template-columns:repeat(5, 1fr); gap:20px;
    padding:24px 24px 24px;
    transition:opacity .7s ease;
  }
  main.dimmed{ opacity:0; }

  .day{
    height:892px; display:flex; flex-direction:column;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.09);
    border-radius:20px; overflow:hidden;
  }
  .day.today{
    background:rgba(255,255,255,.07);
    border:2px solid rgba(255,255,255,.35);
    box-shadow:0 0 36px rgba(255,255,255,.08);
  }

  .dayHead{
    height:84px; flex:0 0 84px;
    display:flex; align-items:center; gap:16px; padding:0 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .day.today .dayHead{ background:linear-gradient(135deg, #4b5260, #2c313a); border-bottom-color:transparent; }
  .dayNum{
    width:56px; height:56px; flex:0 0 56px; border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.1); line-height:1;
  }
  .day.today .dayNum{ background:#fff; color:#1f2329; }
  .dayNum b{ font-family:'DM Mono', monospace; font-size:26px; font-weight:500; }
  .dayNum small{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-top:3px; opacity:.75; }
  .dayInfo{ flex:1; min-width:0; }
  .dayName{ font-size:22px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:10px; }
  .todayChip{
    font-size:12px; font-weight:800; letter-spacing:.1em;
    background:var(--gold); color:var(--navy-900); padding:4px 9px; border-radius:6px;
  }
  .dayCount{ font-size:14px; color:rgba(255,255,255,.6); margin-top:4px; }
  .day.today .dayCount{ color:rgba(255,255,255,.85); }

  /* ---------- Cuerpo del día: páginas de 5 partidos ---------- */
  .dayBody{ position:relative; flex:1 1 auto; }
  .page{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; gap:12px; padding:12px;
    opacity:0; transform:translateY(24px); pointer-events:none;
    transition:opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1);
  }
  .page.active{ opacity:1; transform:none; }
  .page .match{ opacity:0; transform:translateX(-14px); transition:opacity .45s ease, transform .45s cubic-bezier(.16,1,.3,1); }
  .page.active .match{ opacity:1; transform:none; }
  .page.active .match:nth-child(2){ transition-delay:.06s; }
  .page.active .match:nth-child(3){ transition-delay:.12s; }
  .page.active .match:nth-child(4){ transition-delay:.18s; }
  .page.active .match:nth-child(5){ transition-delay:.24s; }

  .empty{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:rgba(255,255,255,.4); font-size:18px; font-weight:500;
  }
  .empty .ball{ font-size:42px; opacity:.5; }

  /* ---------- Tarjeta de partido (alto fijo: 5 por columna) ---------- */
  .match{
    height:140px; flex:0 0 140px; position:relative;
    display:flex; flex-direction:column; justify-content:space-between;
    background:#fff; color:var(--ink);
    border-radius:14px; padding:10px 14px 9px 14px; overflow:hidden;
    border:4px solid var(--comp-color);   /* color de la competencia en todo el borde de la tarjeta */
    box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .match .top{ display:flex; align-items:center; justify-content:space-between; gap:10px; height:22px; }
  .comp{
    display:flex; align-items:center; gap:7px; min-width:0;
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
  }
  .comp img{ width:20px; height:20px; object-fit:contain; flex:0 0 20px; padding:2px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(15,23,42,.14), 0 1px 2px rgba(15,23,42,.15); }
  .comp span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .badge.live{ background:var(--live-soft); color:var(--live); }
  .badge.live .dot{ width:8px; height:8px; border-radius:50%; background:var(--live); animation:blink 1s infinite; }
  .badge.done{ background:var(--done-soft); color:var(--done); }

  .title{
    font-size:20px; font-weight:800; line-height:1.18; letter-spacing:-.005em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .bottom{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; height:28px; }
  .venue{
    font-size:13px; color:var(--muted); min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-bottom:3px;
  }
  .kickoff{ font-family:'DM Mono', monospace; font-size:24px; font-weight:500; color:var(--blue-dark); white-space:nowrap; line-height:1; }
  .score{ display:flex; align-items:baseline; gap:8px; white-space:nowrap; line-height:1; }
  .score b{ font-family:'DM Mono', monospace; font-size:28px; font-weight:500; }
  .score small{ font-size:13px; font-weight:700; color:var(--live); }

  /* ---------- Equipos con escudo ---------- */
  .teams{ display:flex; align-items:center; gap:12px; height:62px; }
  .teamList{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .team{ display:flex; align-items:center; gap:10px; height:30px; min-width:0; }
  /* Todos los escudos, banderas e iniciales van en el mismo círculo con borde suave */
  .crest{
    position:relative; width:30px; height:30px; flex:0 0 30px; border-radius:50%;
    background:#e8edf4; color:#475569; font-size:10px; font-weight:800; letter-spacing:.02em;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 0 0 1px rgba(15,23,42,.14), 0 1px 3px rgba(15,23,42,.18);
  }
  .crest img{ position:absolute; top:2px; left:2px; width:calc(100% - 4px); height:calc(100% - 4px); object-fit:contain; image-rendering:auto; }
  .crest.has-img{ background:#fff; }
  .crest.has-img .ini{ visibility:hidden; }
  .crest.flag img{ top:0; left:0; width:100%; height:100%; object-fit:cover; }
  .tname{ font-size:18px; font-weight:800; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:4px; }
  .goal{ font-family:'DM Mono', monospace; font-size:26px; font-weight:500; height:29px; line-height:29px; min-width:22px; text-align:right; }
  .match.vivo .goal{ color:var(--live); }
  .match.finalizado .tname{ color:#334155; }
  .match.finalizado .goal.win{ font-weight:500; color:var(--ink); }
  .match.finalizado .goal.lose{ color:#94a3b8; }
  .venueRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; height:16px; }
  .venueRow .venue{ padding-bottom:0; }
  .side .kickoff{ font-size:22px; display:flex; align-items:baseline; gap:4px; }
  .side .kickoff small{ font-family:'DM Sans', sans-serif; font-size:12px; font-weight:800; letter-spacing:.04em; }
  .round{ font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; max-width:45%; overflow:hidden; text-overflow:ellipsis; flex:0 0 auto; }
  .minute{ font-size:13px; font-weight:800; color:var(--live); white-space:nowrap; }

  /* ---------- Diseño "versus": escudos grandes a los lados ---------- */
  .match.versus{ padding:8px 10px 7px 10px; }
  .match.versus .venueRow{ height:14px; }
  .vs{ display:flex; align-items:flex-start; justify-content:space-between; gap:4px; height:80px; }
  .vteam{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .vs .crest{ width:46px; height:46px; flex:0 0 46px; font-size:15px; }
  .vs .crest.has-img{ background:transparent; border-radius:0; box-shadow:none; }
  .vs .crest.has-img img{ top:0; left:0; width:100%; height:100%; filter:drop-shadow(0 2px 3px rgba(15,23,42,.28)); }
  .vs .crest.flag{ width:42px; height:42px; flex:0 0 42px; margin:2px 0; border-radius:50%;
    box-shadow:0 0 0 2px #fff, 0 0 0 3px rgba(15,23,42,.18), 0 2px 5px rgba(15,23,42,.25); }
  .vname{ max-width:100%; font-size:14px; font-weight:800; line-height:1.08; text-align:center;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .vmid{ flex:0 0 auto; align-self:flex-start; height:46px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .vmid .kickoff{ font-size:22px; display:flex; align-items:baseline; gap:3px; }
  .vmid .kickoff small{ font-family:'DM Sans', sans-serif; font-size:12px; font-weight:800; letter-spacing:.04em; }
  .vscore{ display:flex; align-items:baseline; gap:6px; font-family:'DM Mono', monospace; }
  .vscore .goal{ font-size:34px; height:auto; line-height:1; min-width:0; }
  .vscore .dash{ font-size:24px; color:#64748b; }
  .match.versus.finalizado .vname{ color:#334155; }
  .match.versus.on-dark .vname{ color:#fff; }
  .match.vivo{ box-shadow:0 0 0 2px #fff, 0 0 0 5px var(--live), 0 6px 22px rgba(225,29,72,.45); animation:liveGlow 2s ease-in-out infinite; }
  .match.vivo .score b{ color:var(--live); }
  .match{ background:var(--card-bg, #fff); }
  .match.finalizado{ background:var(--card-bg, #f4f6f9); }
  /* Tarjeta sólida con fondo oscuro: todo el texto en blanco */
  .match.on-dark{ color:#fff; }
  .match.on-dark .tname, .match.on-dark .title, .match.on-dark .kickoff,
  .match.on-dark .goal, .match.on-dark.finalizado .tname, .match.on-dark .goal.win{ color:#fff; }
  .match.on-dark .comp, .match.on-dark .venue, .match.on-dark .round{ color:rgba(255,255,255,.82); }
  .match.on-dark .goal.lose{ color:rgba(255,255,255,.5); }
  .match.on-dark .minute{ color:#fff; }
  /* Tarjeta sólida con fondo claro: texto oscuro */
  .match.on-light .kickoff{ color:#0f172a; }
  .match.on-light .comp, .match.on-light .venue, .match.on-light .round{ color:rgba(15,23,42,.72); }
  .match.on-light.vivo .goal{ color:#b91c1c; }
  .match.on-dark.vivo .goal{ color:#fff; }
  .match.finalizado .title{ color:#334155; }
  .match .progress{ position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--live-soft); }
  .match .progress i{ display:block; height:100%; background:var(--live); }

  /* ---------- Pie del día: indicador de páginas ---------- */
  .dayFoot{
    height:36px; flex:0 0 36px; display:flex; align-items:center; justify-content:center; gap:14px;
    padding:0 20px; position:relative;
  }
  .dots{ display:flex; gap:8px; }
  .dots i{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.25); transition:all .4s ease; }
  .dots i.on{ width:26px; border-radius:5px; background:var(--sky); }
  .pageTxt{ font-size:13px; color:rgba(255,255,255,.6); font-family:'DM Mono', monospace; }
  .pbar{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.06); }
  .pbar i{ display:block; height:100%; width:0; background:var(--sky); animation:fill var(--page-seconds) linear forwards; }

  /* ---------- Pie general ---------- */
  footer{
    height:44px; flex:0 0 44px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
    padding:0 40px; font-size:14px; color:rgba(255,255,255,.6);
    border-top:1px solid rgba(255,255,255,.08);
  }
  .legend{ display:flex; gap:24px; flex:1; justify-content:center; }
  .legend span{ display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  .legend i{ width:12px; height:12px; border-radius:3px; }
  .online{ display:flex; align-items:center; gap:8px; color:#34d399; font-weight:600; }
  .online i{ width:9px; height:9px; border-radius:50%; background:#34d399; box-shadow:0 0 8px #34d399; animation:blink 1.6s infinite; }

  /* ---------- Imágenes de Drive ---------- */
  .overlay{
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:50;
    display:flex; align-items:center; justify-content:center; background:#000;
    opacity:0; visibility:hidden; transition:opacity .7s ease, visibility .7s ease;
  }
  .overlay.visible{ opacity:1; visibility:visible; }
  .overlay img{ max-width:100%; max-height:100%; object-fit:contain; animation:fadeIn .6s ease both; }

  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes fill{ from{width:0;} to{width:100%;} }
  @keyframes pillPulse{ 0%{box-shadow:0 0 0 0 rgba(225,29,72,.55);} 70%{box-shadow:0 0 0 14px rgba(225,29,72,0);} 100%{box-shadow:0 0 0 0 rgba(225,29,72,0);} }
  @keyframes liveGlow{
    0%,100%{ box-shadow:0 0 0 2px #fff, 0 0 0 5px var(--live), 0 6px 22px rgba(225,29,72,.45); }
    50%{ box-shadow:0 0 0 2px #fff, 0 0 0 5px rgba(225,29,72,.5), 0 6px 30px rgba(225,29,72,.25); }
  }
</style>
</head>

  document.getElementById("stage").style.setProperty("--k", String(k));
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", fitStage);
fitStage();
document.documentElement.style.setProperty("--page-seconds", CONFIG.PAGE_SECONDS + "s");
renderClock();
loadEvents();
fetchLogos();
setInterval(fetchLogos, CONFIG.LOGOS_REFRESH_MS);
setInterval(tick, CONFIG.TICK_MS);
setInterval(loadEvents, CONFIG.REFRESH_EVENTS_MS);

/* Modo combinado (dentro de pantalla.html): sin imágenes de Drive y las páginas
   de cada día arrancan desde la primera cada vez que el calendario vuelve a pantalla. */
const COMBINADO = /[?&]combinado=1/.test(location.search);
let pageInterval = setInterval(flipPages, CONFIG.PAGE_SECONDS * 1e3);
if (COMBINADO) {
  window.addEventListener("message", (e) => {
    if (!e.data || e.data.cmd !== "start") return;
    clearInterval(pageInterval);
    pageTick = -1;
    flipPages();                       // vuelve a la página 1 de cada día y reinicia la barra
    pageInterval = setInterval(flipPages, CONFIG.PAGE_SECONDS * 1e3);
  });
} else {
  fetchDriveImages();
  scheduleView();
  setInterval(fetchDriveImages, CONFIG.DRIVE_REFRESH_MS);
}
</script>
</body>
</html>
