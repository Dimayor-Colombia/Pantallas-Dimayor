<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light only">
<title>DIMAYOR · Pantallas</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  /* Pantalla combinada: alterna el calendario (calendario.html) y las noticias (noticias.html) */
  html,body{ width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#050608; }
  iframe{
    position:fixed; top:0; left:0; width:100%; height:100%; border:0; background:#050608;
    opacity:0; visibility:hidden; transition:opacity .8s ease, visibility .8s ease;
  }
  iframe.on{ opacity:1; visibility:visible; }
</style>
</head>
<body>
<iframe id="cal"  src="calendario.html?combinado=1"    title="Calendario"></iframe>
<iframe id="news" src="noticias.html?combinado=1" title="Noticias"></iframe>
<script>
/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
const CONFIG = {
  CALENDARIO_SEGUNDOS: 120,        // tiempo del calendario en pantalla (2 minutos)
  NOTICIAS_MAX_SEGUNDOS: 300,      // seguridad: si noticias no avisa que terminó, vuelve al calendario a los 5 min
  RELOAD_AT_MIDNIGHT: true         // recarga todo a medianoche
};

const cal = document.getElementById("cal");
const news = document.getElementById("news");
let timer = null, view = "";

function send(frame, msg) {
  try { frame.contentWindow.postMessage(msg, "*"); } catch (e) { console.warn(e); }
}
function show(frame) {
  cal.classList.toggle("on", frame === cal);
  news.classList.toggle("on", frame === news);
}

// 1) Calendario durante 2 minutos
function showCalendar(reiniciar) {
  view = "cal";
  clearTimeout(timer);
  if (reiniciar !== false) send(cal, { cmd: "start" });   // vuelve a la página 1 de cada día
  show(cal);
  timer = setTimeout(showNews, CONFIG.CALENDARIO_SEGUNDOS * 1e3);
}

// 2) Todas las noticias una vez; al terminar, noticias.html avisa "newsDone"
function showNews() {
  view = "news";
  clearTimeout(timer);
  send(news, { cmd: "start" });
  timer = setTimeout(showCalendar, CONFIG.NOTICIAS_MAX_SEGUNDOS * 1e3);
  // se muestra un instante después para que la primera noticia ya esté puesta al aparecer
  setTimeout(() => { if (view === "news") show(news); }, 700);
}

window.addEventListener("message", (e) => {
  // si no hay noticias de hoy ni ayer, el calendario sigue sin reiniciarse
  if (e.data && e.data.evt === "newsDone" && view === "news") showCalendar(e.data.total > 0);
});

// Arranca cuando el calendario termina de cargar
let started = false;
function start() { if (!started) { started = true; showCalendar(); } }
cal.addEventListener("load", () => setTimeout(start, 500));
setTimeout(start, 8000); // por si el evento load no llega

// Recarga completa a medianoche (hora Colombia)
let day = new Date(Date.now() - 5 * 36e5).toISOString().slice(0, 10);
setInterval(() => {
  const d = new Date(Date.now() - 5 * 36e5).toISOString().slice(0, 10);
  if (d !== day && CONFIG.RELOAD_AT_MIDNIGHT) location.reload();
}, 60e3);
</script>
</body>
</html>
