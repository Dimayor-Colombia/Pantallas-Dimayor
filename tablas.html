<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light only">
<title>DIMAYOR · Tablas de Posiciones</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     DISEÑO FIJO PARA PANTALLA 1920 x 1080 (Full HD)
     Mismo estilo del board de Partidos de la Semana
     ========================================================= */
  :root{
    color-scheme: light only;
    --ink:#0f172a;
    --sky:#d1d5db;
    --page-seconds:20s;
  }
  *{ box-sizing:border-box; }
  html,body{
    width:100%; height:100%; margin:0; padding:0; overflow:hidden;
    font-family:'DM Sans', sans-serif; color:#fff;
    background:
      radial-gradient(900px 500px at 8% -10%, rgba(255,255,255,.06), transparent 65%),
      linear-gradient(180deg, #0d0f14, #050608);
  }
  #stage{
    position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform-origin:center center;
    transform:translate(-50%, -50%) scale(var(--k, 1));
  }
  .board{ width:100%; height:100%; display:flex; flex-direction:column; }

  /* ---------- Encabezado ---------- */
  header{
    height:96px; flex:0 0 96px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 40px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand{ display:flex; align-items:center; gap:22px; }
  .brand img{ height:46px; }
  .brand .sep{ width:2px; height:44px; background:rgba(255,255,255,.18); border-radius:2px; }
  .brand .t1{ font-size:30px; font-weight:800; letter-spacing:.01em; line-height:1.05; }
  .brand .t2{ font-size:15px; color:rgba(255,255,255,.6); margin-top:4px; letter-spacing:.04em; text-transform:uppercase; }
  .clock{ text-align:right; }
  .clock .time{ font-family:'DM Mono', monospace; font-size:38px; font-weight:500; line-height:1; }
  .clock .date{ font-size:15px; color:rgba(255,255,255,.65); margin-top:6px; }

  /* ---------- Cuerpo ---------- */
  main{ height:940px; flex:0 0 940px; padding:20px 24px 16px; position:relative; }
  .page{ height:100%; display:flex; flex-direction:column; gap:14px; transition:opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1); }
  .page.out{ opacity:0; transform:translateY(18px); }

  /* Franja de la competencia */
  .compBar{ height:64px; flex:0 0 64px; display:flex; align-items:center; gap:18px; padding:0 8px; }
  .compBar .logo{ width:56px; height:56px; border-radius:50%; background:#fff; padding:5px; object-fit:contain;
    box-shadow:0 0 0 3px var(--comp-color), 0 6px 18px rgba(0,0,0,.35); }
  .compBar .name{ font-size:32px; font-weight:800; letter-spacing:.01em; }
  .compBar .name small{ display:block; font-size:14px; font-weight:600; color:rgba(255,255,255,.55); letter-spacing:.06em; text-transform:uppercase; margin-top:2px; }
  .compBar .right{ margin-left:auto; display:flex; align-items:center; gap:18px; }
  .dots{ display:flex; gap:8px; }
  .dots i{ width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.25); transition:all .4s ease; }
  .dots i.on{ width:28px; border-radius:5px; background:var(--sky); }

  .tables{ flex:1; min-height:0; display:grid; gap:20px; }
  .tables.one{ grid-template-columns:1fr 440px; }
  .tables.two{ grid-template-columns:1fr 1fr; }
  .tables.many{ grid-template-columns:repeat(2, 1fr); grid-auto-rows:1fr; }

  /* Tabla */
  .tbl{ display:flex; flex-direction:column; min-height:0; overflow:hidden;
    background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.1); border-radius:18px; }
  .tblTitle{ height:50px; flex:0 0 50px; display:flex; align-items:center; gap:12px; padding:0 20px;
    background:var(--comp-color); color:#fff; font-size:20px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    text-shadow:0 1px 2px rgba(0,0,0,.45); }  /* títulos siempre en blanco (sombra suave para que se lea sobre colores claros) */
  .tblTitle .tag{ margin-left:auto; font-size:13px; font-weight:700; letter-spacing:.05em; opacity:.8; }
  .cols, .row{ display:grid; align-items:center; grid-template-columns:62px 52px 1fr repeat(7, 66px) 92px; padding:0 14px 0 10px; }
  /* con dos tablas lado a lado, columnas de números más angostas para que quepa el nombre completo */
  .tables.two .cols, .tables.two .row, .tables.many .cols, .tables.many .row{ grid-template-columns:52px 48px 1fr repeat(7, 50px) 70px; padding:0 8px 0 6px; }
  .cols{ height:38px; flex:0 0 38px; font-size:14px; font-weight:800; letter-spacing:.08em; color:rgba(255,255,255,.55); text-transform:uppercase;
    border-bottom:1px solid rgba(255,255,255,.1); }
  .cols span, .row span{ text-align:center; }
  .cols .tn, .row .tn{ text-align:left; }
  .rows{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .row{ height:var(--rowh); flex:0 0 var(--rowh); font-size:var(--fs); font-variant-numeric:tabular-nums;
    border-bottom:1px solid rgba(255,255,255,.05); position:relative;
    animation:slideIn .45s cubic-bezier(.16,1,.3,1) both; }
  .row:nth-child(even){ background:rgba(255,255,255,.025); }
  .row.zona::before{ content:""; position:absolute; left:0; top:3px; bottom:3px; width:5px; border-radius:0 4px 4px 0; background:var(--comp-color); }
  .row.lider{ background:rgba(255,255,255,.07); }
  .pos{ display:inline-flex; align-items:center; justify-content:center; width:calc(var(--rowh) * .74); height:calc(var(--rowh) * .74);
    border-radius:9px; font-weight:800; justify-self:center; }
  .row.zona .pos{ background:var(--comp-color); color:var(--on-comp); }
  .row .tn{ padding-left:6px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:10px; }
  .row .st{ color:rgba(255,255,255,.82); }
  .row .dg.pos-dg{ color:#4ade80; } .row .dg.neg-dg{ color:#f87171; }
  .row .pts, .cols .pts{ font-weight:800; }
  .row .pts{ font-size:calc(var(--fs) * 1.18); background:rgba(255,255,255,.06); align-self:stretch; display:flex; align-items:center; justify-content:center; }

  /* Escudos (con iniciales de respaldo) */
  .crest{ position:relative; width:calc(var(--rowh) * .8); height:calc(var(--rowh) * .8); justify-self:center;
    display:flex; align-items:center; justify-content:center; }
  .crest img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .crest .ini{ width:100%; height:100%; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--rowh) * .3); font-weight:800; color:rgba(255,255,255,.85); }
  .crest.has-img .ini{ visibility:hidden; }

  /* Panel lateral (cuando la competencia tiene una sola tabla) */
  .side{ display:flex; flex-direction:column; gap:16px; min-height:0; }
  .stat{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:10px; padding:20px 24px;
    background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.1); border-radius:18px; position:relative; overflow:hidden; }
  .stat::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--comp-color); }
  .stat .lbl{ font-size:15px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.6); }
  .stat .who{ display:flex; align-items:center; gap:16px; }
  .stat .who .crest{ --rowh:72px; flex:0 0 auto; }
  .stat .team{ font-size:26px; font-weight:800; line-height:1.1; }
  .stat .val{ font-family:'DM Mono', monospace; font-size:20px; color:rgba(255,255,255,.75); margin-top:4px; }
  .stat .val b{ font-family:'DM Sans', sans-serif; font-size:30px; color:#fff; }
  .stat.lead{ flex:1.35; }
  .stat.lead .who .crest{ --rowh:104px; }
  .stat.lead .team{ font-size:32px; }
  .note{ font-size:15px; color:rgba(255,255,255,.6); display:flex; align-items:center; gap:10px; padding:0 6px; }
  .note i{ width:14px; height:14px; border-radius:4px; background:var(--comp-color); flex:0 0 14px; }


  /* Grupos, descenso y etiqueta de fase */
  .tables.grupos{ grid-auto-rows:auto; align-content:center; }
  .tables.grupos .tbl{ height:auto; }
  .tables.full{ grid-template-columns:1fr; }
  /* tablas cortas (ej. una final): centradas, sin estirarse */
  .tables.one.corta > .tbl{ align-self:center; height:auto; }
  .tables.grupos .cols, .tables.grupos .row{ grid-template-columns:52px 62px 1fr repeat(7, 50px) 70px; padding:0 8px 0 6px; }
  .pill{ display:inline-flex; align-items:center; height:40px; padding:0 18px; border-radius:22px; background:var(--comp-color); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.45);
    font-size:17px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .tbl.desc .cols2{ height:30px; flex:0 0 30px; border-bottom:none; }
  .tbl.desc .yr{ font-size:15px; color:#fff; background:rgba(255,255,255,.06); border-radius:8px 8px 0 0; padding:4px 0; margin:0 6px; }
  .tbl.desc .yr.tot{ background:rgba(255,255,255,.12); }
  .tbl.desc .st.tot{ color:#fff; font-weight:700; }
  .row.zona.baja::before{ background:#ef4444; }
  .row.zona.baja .pos{ background:#ef4444; color:#fff; }
  .row.zona.baja{ background:rgba(239,68,68,.10); }

  .progress{ position:absolute; left:24px; right:24px; bottom:6px; height:4px; border-radius:2px; background:rgba(255,255,255,.06); overflow:hidden; }
  .progress i{ display:block; height:100%; width:0; background:var(--sky); }
  .progress i.run{ animation:fill var(--page-seconds) linear forwards; }

  .empty{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    color:rgba(255,255,255,.45); font-size:24px; font-weight:500; }
  .empty .ico{ font-size:52px; opacity:.6; }

  /* ---------- Pie general ---------- */
  footer{
    /* 3 columnas iguales a los lados: la leyenda queda siempre en el centro exacto de la pantalla */
    height:44px; flex:0 0 44px; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:24px;
    padding:0 40px; font-size:14px; color:rgba(255,255,255,.6); border-top:1px solid rgba(255,255,255,.08);
  }
  footer > span:first-child{ min-width:0; overflow:hidden; white-space:nowrap; }
  .legend{ display:flex; gap:24px; justify-content:center; }
  .legend span{ display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  .legend i{ width:12px; height:12px; border-radius:3px; }
  .online{ justify-self:end; display:flex; align-items:center; gap:8px; color:#34d399; font-weight:600; }
  .online i{ width:9px; height:9px; border-radius:50%; background:#34d399; box-shadow:0 0 8px #34d399; animation:blink 1.6s infinite; }
  .online.off{ color:#fbbf24; } .online.off i{ background:#fbbf24; box-shadow:0 0 8px #fbbf24; }

  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  @keyframes fill{ from{width:0;} to{width:100%;} }
  @keyframes slideIn{ from{opacity:0; transform:translateX(-14px);} to{opacity:1; transform:none;} }
</style>
</head>
<body>
<div id="stage">
<div class="board">
  <header>
    <div class="brand">
      <img src="https://lh3.googleusercontent.com/d/1l4mdgdoIJxuPBRY8VDhhC-AJQW6vgdWr" alt="DIMAYOR">
      <div class="sep"></div>
      <div>
        <div class="t1">Tablas de Posiciones</div>
        <div class="t2">Competiciones BetPlay DIMAYOR</div>
      </div>
    </div>
    <div class="clock">
      <div class="time" id="clockTime">--:--</div>
      <div class="date" id="clockDate">--</div>
    </div>
  </header>

  <main>
    <div class="page" id="page"><div class="empty"><span class="ico">📊</span>Cargando tablas…</div></div>
    <div class="progress"><i id="progress"></i></div>
  </main>

  <footer>
    <!-- Texto de estado oculto en pantalla (sigue existiendo para revisar errores; quitar style para verlo) -->
    <span id="statusLine" style="visibility:hidden">Iniciando…</span>
    <div class="legend" id="legend"></div>
    <span class="online" id="online"><i></i>En línea</span>
  </footer>
</div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
const CONFIG = {
  // Archivo con las tablas: lo genera y actualiza cada hora la tarea de GitHub ".github/workflows/tablas.yml"
  DATOS: "tablas.json",
  GITHUB_REPO: "Dimayor-Colombia/Pantallas-Dimayor",
  SEGUNDOS_POR_PAGINA: 20,          // tiempo de cada competencia en pantalla
  REFRESH_MS: 10 * 60 * 1e3,        // cada cuánto vuelve a leer tablas.json
  RELOAD_AT_MIDNIGHT: true,
  LOGOS_DIR: "escudos",             // carpeta de escudos del repositorio (los mismos del calendario)
  LOGO_DIMAYOR: "https://lh3.googleusercontent.com/d/1l4mdgdoIJxuPBRY8VDhhC-AJQW6vgdWr"
};

/* Competencias: mismos colores y logos del calendario. "id" es el que usa tablas.json.
   Las tablas que se muestran de cada una se eligen en la tarea de GitHub (.github/workflows/tablas.yml).
   "zonas": barras de color en las tablas (AJUSTAR según el reglamento del semestre):
     - clasifican: en la tabla de posiciones de las fases cuyo nombre coincide, los N primeros
     - descienden: en la tabla de descenso, los N últimos (barra roja) */
const COMPETENCIAS = [
  { id: "liga",      label: "Liga BetPlay Dimayor",          color: "#f3cc23", logo: "https://lh3.googleusercontent.com/d/1tVCRbR0BNTcSqzoDd0jgs_9dvrvYK2pX",
    zonas: { clasifican: [{ fase: /todos contra todos/i, n: 8 }], descienden: 2 } },
  { id: "torneo",    label: "Torneo BetPlay Dimayor",        color: "#6fb2e3", logo: "https://lh3.googleusercontent.com/d/1t64NZwLCkCo4ofMZVYzhfcV8pSsVwCfv",
    zonas: { clasifican: [{ fase: /todos contra todos/i, n: 8 }] } },
  { id: "femenina",  label: "Liga Femenina BetPlay Dimayor", color: "#b51a65", logo: "https://lh3.googleusercontent.com/d/1GRGoELSTVM2sDydzsswzi6XvjCDxK84y",
    zonas: { clasifican: [{ fase: /^fase i\b(?!i)/i, n: 8 }] } },
  { id: "copa",      label: "Copa BetPlay Dimayor",          color: "#3bad4c", logo: "https://lh3.googleusercontent.com/d/1TELaujxqcd_Q_I3HwUxriPuUuwOx2Wrl",
    zonas: {} },
  { id: "superliga", label: "Superliga BetPlay Dimayor",     color: "#062a63", logo: "https://lh3.googleusercontent.com/d/1UJxk_10wBGXLNs5_gaVFI6xmUkT47uYq",
    zonas: {} }
];
// Si una tabla tiene más equipos que esto, se parte en dos columnas
const MAX_FILAS_COLUMNA = 20;
const COLOR_DESCENSO = "#ef4444";

/* Nombres bonitos: "FASE II LIGA FEMENINA CUADRANGULARES 2026" -> "Fase II · Cuadrangulares" */
function capital(x) { x = String(x || "").toLowerCase().trim(); return x.charAt(0).toUpperCase() + x.slice(1); }
function nombreFase(n) {
  const s = String(n || "").replace(/\b(liga|femenina|betplay|dimayor|torneo|copa|20\d\d)\b/gi, " ").replace(/\s+/g, " ").trim();
  const m = s.match(/^fase\s+([ivx]+|\d+[ab]?)\b\s*-?\s*(.*)$/i);
  if (!m) return s.split(/\s+-\s+/).map(capital).join(" · ");
  const resto = m[2].replace(/^-\s*|\s*-$/g, "").trim();
  return "Fase " + m[1].toUpperCase() + (resto ? " · " + resto.split(/\s+-\s+/).map(capital).join(" · ") : "");
}
function tituloBloque(b) {
  if (b.tipo === "reclasificacion") return "Reclasificación";
  if (b.tipo === "descenso") return "Descenso · Promedios";
  return "Posiciones · " + nombreFase(b.fase);
}
function nombreGrupo(g) {
  const m = String(g.nombre || "").match(/grupo\s+\w+/i);
  return m ? capital(m[0]).replace(/\w$/, (c) => c.toUpperCase()) : nombreFase(g.nombre);
}

/* Nombres como se muestran en pantalla, si alguno se quiere cambiar: "nombre en dimayor.com.co": "nombre a mostrar" */
const NOMBRES = {};
// Si un escudo de la carpeta no coincide solo: "nombre del equipo": "nombre del archivo sin .png"
const TEAM_LOGO_ALIASES = {
  "Independiente Valle del Cauca": "LOGO IVC (1)",
  "Internacional F.C. de Palmira": "Escudo Internacional de Palmira",
  "Internacional de Bogotá": "Escudo Internacional de Bogota"
};

/* ---------- Fechas (hora Colombia) ---------- */
const WD_NAMES = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const MESES_LARGO = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const BOGOTA_OFFSET_MS = -5 * 60 * 60 * 1e3;
function bogota(d) { return new Date(new Date(d).getTime() + BOGOTA_OFFSET_MS); }
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function dateKeyBogota(d) { const b = bogota(d); return b.getUTCFullYear() + "-" + pad2(b.getUTCMonth() + 1) + "-" + pad2(b.getUTCDate()); }
function todayKey() { return dateKeyBogota(new Date()); }
function fmtTime(d) {
  const b = bogota(d), h = b.getUTCHours(), h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ":" + pad2(b.getUTCMinutes()) + " " + (h < 12 ? "AM" : "PM");
}
function fmtFecha(d) { const k = dateKeyBogota(d); return Number(k.slice(8, 10)) + " " + MESES[Number(k.slice(5, 7)) - 1] + " · " + fmtTime(d); }

/* ---------- Utilidades ---------- */
function esc(s) { return String(s != null ? s : "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function normalizeName(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
function hexToRgb(hex) {
  const h = String(hex || "#888888").replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map((c) => c + c).join("") : h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function onColor(hex) {
  const [r, g, b] = hexToRgb(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.35 ? "#0f172a" : "#ffffff";
}
async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
function nombre(eq) { return NOMBRES[eq] || eq; }

/* =========================================================
   ESCUDOS (carpeta "escudos" del repositorio, igual que el calendario)
   ========================================================= */
const LOGOS = { list: [] };
const LOGO_STOP = new Set(["escudo", "logo", "fc", "f", "c", "sa", "sc", "daf", "de", "del", "la", "el", "los", "las", "y", "png", "jpg", "jpeg", "webp", "1", "2", "femenino", "femenina", "fem"]);
const LOGO_GENERIC = new Set(["deportivo", "deportes", "atletico", "independiente", "real", "union", "club", "internacional", "boca", "juniors"]);
function logoWords(name) { return normalizeName(name).split(" ").filter((w) => w && !LOGO_STOP.has(w)); }
function logoEntry(file) {
  const base = file.replace(/\.[a-z0-9]+$/i, "");
  const forms = [file];
  if (file.normalize) [file.normalize("NFC"), file.normalize("NFD")].forEach((f) => { if (forms.indexOf(f) === -1) forms.push(f); });
  const paths = forms.map((f) => CONFIG.LOGOS_DIR + "/" + encodeURIComponent(f));
  return { base: normalizeName(base), words: logoWords(base), url: paths[0],
           alts: paths.slice(1).concat(paths.map((p) => `https://raw.githubusercontent.com/${CONFIG.GITHUB_REPO}/HEAD/${p}`)) };
}
async function fetchLogos() {
  try {
    const data = await getJSON(`https://api.github.com/repos/${CONFIG.GITHUB_REPO}/git/trees/HEAD?recursive=1`);
    const prefix = CONFIG.LOGOS_DIR + "/";
    LOGOS.list = (data.tree || []).filter((f) => f.type === "blob" && f.path.indexOf(prefix) === 0 && f.path.slice(prefix.length).indexOf("/") === -1
      && /\.(png|jpe?g|webp|gif|svg)$/i.test(f.path)).map((f) => logoEntry(f.path.slice(prefix.length)));
  } catch (err) { console.warn("No se pudo listar la carpeta de escudos", err); }
  LOGO_CACHE.clear();
  if (DATA) render(true);
}
function sameWord(a, b) {
  if (a === b) return true;
  if (a.length < 5 || b.length < 5 || Math.abs(a.length - b.length) > 1) return false;
  const d = [];
  for (let i = 0; i <= a.length; i++) d[i] = [i];
  for (let j = 0; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length] <= 1;
}
const LOGO_CACHE = new Map();
function findLogo(team) {
  if (LOGO_CACHE.has(team)) return LOGO_CACHE.get(team);
  let result = null;
  const aliasKey = Object.keys(TEAM_LOGO_ALIASES).find((k) => normalizeName(k) === normalizeName(team));
  if (aliasKey) result = LOGOS.list.find((l) => l.base === normalizeName(TEAM_LOGO_ALIASES[aliasKey])) || null;
  if (!result) {
    const words = logoWords(team), hasSpecific = words.some((w) => !LOGO_GENERIC.has(w));
    let best = null, score = 0, ratio = 0, tie = false;
    LOGOS.list.forEach((l) => {
      const common = l.words.filter((w) => words.some((x) => sameWord(x, w)));
      if (!common.length || (hasSpecific && !common.some((w) => !LOGO_GENERIC.has(w)))) return;
      const r = common.length / l.words.length;
      if (common.length > score || (common.length === score && r > ratio)) { best = l; score = common.length; ratio = r; tie = false; }
      else if (common.length === score && r === ratio && best && l.base !== best.base) tie = true;
    });
    result = tie ? null : best;
  }
  LOGO_CACHE.set(team, result);
  return result;
}
function initials(name) {
  const w = logoWords(name).filter((x) => !LOGO_GENERIC.has(x));
  return (w.length ? w : logoWords(name)).slice(0, 2).map((x) => x.charAt(0).toUpperCase()).join("") || "?";
}
function crestFail(img) {
  const alts = (img.getAttribute("data-alts") || "").split("|").filter(Boolean);
  if (alts.length) { img.setAttribute("data-alts", alts.slice(1).join("|")); img.src = alts[0]; return; }
  img.parentNode.classList.remove("has-img"); img.remove();
}
// Escudo: 1) carpeta "escudos"  2) el que trae la API  3) iniciales
function crestHTML(team, apiLogo) {
  const l = findLogo(team);
  const url = l ? l.url : apiLogo;
  const alts = l ? l.alts.concat(apiLogo ? [apiLogo] : []) : [];
  const img = url ? `<img src="${esc(url)}" data-alts="${esc(alts.join("|"))}" alt="" onerror="crestFail(this)">` : "";
  return `<span class="crest ${url ? "has-img" : ""}"><span class="ini">${esc(initials(team))}</span>${img}</span>`;
}

/* =========================================================
   DATOS Y PÁGINAS
   ========================================================= */
let DATA = null, PAGES = [], pageIdx = 0, pageTimer = null, lastJSON = "";

async function loadData() {
  const status = document.getElementById("statusLine"), online = document.getElementById("online");
  const v = Math.floor(Date.now() / 6e5);
  const urls = [`${CONFIG.DATOS}?v=${v}`, `https://raw.githubusercontent.com/${CONFIG.GITHUB_REPO}/HEAD/${CONFIG.DATOS}?v=${v}`];
  for (const u of urls) {
    try {
      const data = await getJSON(u);
      online.classList.remove("off"); online.lastChild.textContent = "En línea";
      status.textContent = `Leído ${fmtTime(new Date())}`;
      const txt = JSON.stringify(data);
      if (txt !== lastJSON) { lastJSON = txt; DATA = data; buildPages(); render(true); }
      return;
    } catch (err) { console.warn("No se pudo leer", u, err); }
  }
  status.textContent = "No se pudo leer tablas.json";
  online.classList.add("off"); online.lastChild.textContent = "Sin conexión";
  if (!DATA) document.getElementById("page").innerHTML = `<div class="empty"><span class="ico">📊</span>Aún no hay tablas publicadas</div>`;
}

function buildPages() {
  const prevKey = PAGES[pageIdx] && PAGES[pageIdx].key;
  PAGES = [];
  COMPETENCIAS.forEach((comp) => {
    const c = ((DATA && DATA.competencias) || []).find((x) => x.id === comp.id);
    if (!c || !c.bloques) return;
    c.bloques.forEach((bloque, i) => PAGES.push({ key: comp.id + "-" + i + "-" + bloque.tipo, comp, data: c, bloque }));
  });
  const keep = PAGES.findIndex((p) => p.key === prevKey);
  pageIdx = keep >= 0 ? keep : 0;
  renderLegend();
}

// ¿Cuántos se marcan como clasificados en esta tabla?
function clasificanEn(comp, bloque) {
  if (bloque.tipo !== "posiciones") return 0;
  const z = ((comp.zonas || {}).clasifican || []).find((x) => x.fase.test(nombreFase(bloque.fase)) || x.fase.test(bloque.fase || ""));
  return z ? z.n : 0;
}

const ALTO_TABLAS = 940 - 36 - 64 - 14;   // alto disponible para las tablas en cada página
function medidas(altoTabla, filas, cabeceras) {
  const rowh = Math.max(28, Math.min(58, Math.floor((altoTabla - 50 - 38 * (cabeceras || 1) - 4) / Math.max(1, filas))));
  return `--rowh:${rowh}px;--fs:${Math.round(rowh * 0.46)}px`;
}

function tableHTML(titulo, filas, opts) {
  const o = opts || {};
  const rows = filas.map((f, i) => {
    const eq = nombre(f.equipo);
    const cls = [o.clasifican && f.pos <= o.clasifican ? "zona" : "", f.pos === 1 && !o.sinLider ? "lider" : ""].join(" ");
    const dg = f.dg > 0 ? `+${f.dg}` : String(f.dg);
    return `<div class="row ${cls}" style="animation-delay:${(i * 0.025).toFixed(3)}s">
      <span class="pos">${f.pos}</span>${crestHTML(eq, f.logo)}<span class="tn">${esc(eq)}</span>
      <span class="st">${f.pj}</span><span class="st">${f.g}</span><span class="st">${f.e}</span><span class="st">${f.p}</span>
      <span class="st">${f.gf}</span><span class="st">${f.gc}</span><span class="st dg ${f.dg > 0 ? "pos-dg" : f.dg < 0 ? "neg-dg" : ""}">${dg}</span>
      <span class="pts">${f.pts}</span></div>`;
  }).join("");
  return `<section class="tbl" style="${o.medidas}">
    <div class="tblTitle">${esc(titulo)}${o.rango ? ` <span style="opacity:.75">· ${o.rango}</span>` : ""}<span class="tag">${o.total || filas.length} equipos</span></div>
    <div class="cols"><span>#</span><span></span><span class="tn">Equipo</span><span>PJ</span><span>G</span><span>E</span><span>P</span><span>GF</span><span>GC</span><span>DG</span><span class="pts">PTS</span></div>
    <div class="rows">${rows}</div></section>`;
}

// Tabla de descenso: PJ y PTS por año, totales y promedio
function descensoHTML(page) {
  const b = page.bloque, anios = b.anios || [];
  const n = (page.comp.zonas || {}).descienden || 0;
  const total = b.filas.length;
  const cols = `62px 52px 1fr repeat(${anios.length * 2 + 2}, 74px) 130px`;
  const head1 = `<span></span><span></span><span></span>${anios.map((a) => `<span class="yr" style="grid-column:span 2">${esc(a)}</span>`).join("")}<span class="yr tot" style="grid-column:span 2">Totales</span><span></span>`;
  const head2 = `<span>#</span><span></span><span class="tn">Equipo</span>${anios.map(() => "<span>PJ</span><span>PTS</span>").join("")}<span>PJ</span><span>PTS</span><span class="pts">PROM</span>`;
  const rows = b.filas.map((f, i) => {
    const eq = nombre(f.equipo);
    const baja = n && f.pos > total - n;
    return `<div class="row ${baja ? "zona baja" : ""}" style="grid-template-columns:${cols};animation-delay:${(i * 0.025).toFixed(3)}s">
      <span class="pos">${f.pos}</span>${crestHTML(eq, f.logo)}<span class="tn">${esc(eq)}</span>
      ${(f.anios || []).map((a) => `<span class="st">${a.pj}</span><span class="st">${a.pts}</span>`).join("")}
      <span class="st tot">${f.pj}</span><span class="st tot">${f.pts}</span><span class="pts">${esc(f.pro)}</span></div>`;
  }).join("");
  return `<div class="tables full"><section class="tbl desc" style="${medidas(ALTO_TABLAS, total, 2)}">
    <div class="tblTitle">${esc(tituloBloque(b))}<span class="tag">${n ? `Barra roja: descienden ${n}` : ""}</span></div>
    <div class="cols cols2" style="grid-template-columns:${cols}">${head1}</div>
    <div class="cols" style="grid-template-columns:${cols}">${head2}</div>
    <div class="rows">${rows}</div></section></div>`;
}

// Panel lateral con datos calculados de la misma tabla
function sideHTML(page, filas) {
  // fase que aún no se juega: en vez de estadísticas en cero, un aviso
  if (!filas.some((f) => f.pj > 0)) {
    return `<div class="side"><div class="stat lead"><div class="lbl">Fase en curso</div>
      <div class="team">${esc(nombreFase(page.bloque.fase))}</div><div class="val">Aún sin partidos jugados</div></div></div>`;
  }
  const lider = filas.slice().sort((a, b) => a.pos - b.pos)[0];
  const ataque = filas.slice().sort((a, b) => b.gf - a.gf || a.pos - b.pos)[0];
  const defensa = filas.slice().sort((a, b) => a.gc - b.gc || a.pos - b.pos)[0];
  const n = clasificanEn(page.comp, page.bloque);
  const card = (cls, lbl, row, val) => {
    const eq = nombre(row.equipo);
    return `<div class="stat ${cls}"><div class="lbl">${lbl}</div>
      <div class="who">${crestHTML(eq, row.logo)}<div><div class="team">${esc(eq)}</div><div class="val">${val}</div></div></div></div>`;
  };
  return `<div class="side">
    ${card("lead", page.bloque.tipo === "reclasificacion" ? "Primero en la reclasificación" : "Líder", lider, `<b>${lider.pts}</b> pts · ${lider.pj} PJ`)}
    ${card("", "Mejor ataque", ataque, `<b>${ataque.gf}</b> goles a favor`)}
    ${card("", "Valla menos vencida", defensa, `<b>${defensa.gc}</b> goles en contra`)}
    ${n ? `<div class="note"><i></i>Clasifican a la siguiente fase (${n} primeros)</div>` : ""}
  </div>`;
}

function bodyHTML(page) {
  const b = page.bloque;
  if (b.tipo === "descenso") return descensoHTML(page);
  const n = clasificanEn(page.comp, b);
  const grupos = b.grupos || [];
  // Fase de grupos: todos los grupos en la misma página
  if (grupos.length > 1) {
    const cols = grupos.length <= 4 ? 2 : 3;
    const filasGrid = Math.ceil(grupos.length / cols);
    const alto = (ALTO_TABLAS - 20 * (filasGrid - 1)) / filasGrid;
    const maxFilas = Math.max(...grupos.map((g) => g.filas.length));
    const rowh = Math.max(28, Math.min(60, Math.floor((alto - 50 - 38 - 4) / maxFilas)));
    const med = `--rowh:${rowh}px;--fs:${Math.min(24, Math.round(rowh * 0.44))}px`;
    return `<div class="tables grupos" style="grid-template-columns:repeat(${cols}, 1fr)">
      ${grupos.map((g) => tableHTML(nombreGrupo(g), g.filas, { medidas: med, clasifican: n, sinLider: true })).join("")}</div>`;
  }
  const filas = (grupos[0] || { filas: [] }).filas;
  // Tabla larga: se parte en dos columnas
  if (filas.length > MAX_FILAS_COLUMNA) {
    const mitad = Math.ceil(filas.length / 2);
    const partes = [filas.slice(0, mitad), filas.slice(mitad)];
    return `<div class="tables two">${partes.map((f) => tableHTML(tituloBloque(b), f, { medidas: medidas(ALTO_TABLAS, mitad), clasifican: n,
      rango: `${f[0].pos}–${f[f.length - 1].pos}`, total: filas.length })).join("")}</div>`;
  }
  const corta = filas.length <= 8;
  const med = corta ? `--rowh:64px;--fs:26px` : medidas(ALTO_TABLAS, filas.length);
  return `<div class="tables one ${corta ? "corta" : ""}">${tableHTML(tituloBloque(b), filas, { medidas: med, clasifican: n })}${sideHTML(page, filas)}</div>`;
}

function render(instant) {
  const el = document.getElementById("page");
  if (!PAGES.length) { el.innerHTML = `<div class="empty"><span class="ico">📊</span>Aún no hay tablas publicadas</div>`; return; }
  const page = PAGES[pageIdx % PAGES.length];
  const grupos = page.bloque.grupos || [];
  const pill = grupos.length > 1 ? `<span class="pill">${esc(tituloBloque(page.bloque))}</span>` : "";
  const html = `
    <div class="compBar" style="--comp-color:${page.comp.color};--on-comp:${onColor(page.comp.color)}">
      <img class="logo" src="${page.comp.logo}" alt="" onerror="this.style.display='none'">
      <div class="name">${esc(page.comp.label)}<small>${esc(page.data.competicion || "")} · Datos oficiales ${esc(page.data.fuente)} · actualizado ${esc(fmtFecha(page.data.actualizado))}</small></div>
      <div class="right">${pill}${PAGES.length > 1 ? `<div class="dots">${PAGES.map((p, i) => `<i class="${i === pageIdx ? "on" : ""}" style="${p.comp.id === page.comp.id ? "" : "opacity:.45"}"></i>`).join("")}</div>` : ""}</div>
    </div>
    <div style="display:contents;--comp-color:${page.comp.color};--on-comp:${onColor(page.comp.color)}">${bodyHTML(page)}</div>`;
  const swap = () => {
    el.innerHTML = html;
    el.style.setProperty("--comp-color", page.comp.color);
    el.style.setProperty("--on-comp", onColor(page.comp.color));
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("out")));
    restartProgress();
  };
  if (instant) { swap(); return; }
  el.classList.add("out");
  setTimeout(swap, 600);
}

function restartProgress() {
  const p = document.getElementById("progress");
  p.classList.remove("run"); void p.offsetWidth;
  if (PAGES.length > 1) p.classList.add("run");
}

function renderLegend() {
  document.getElementById("legend").innerHTML = PAGES.filter((p, i) => PAGES.findIndex((q) => q.comp.id === p.comp.id) === i).map((p) => `<span><i style="background:${p.comp.color}"></i>${esc(p.comp.label)}</span>`).join("");
}

function startRotation() {
  clearInterval(pageTimer);
  pageTimer = setInterval(() => {
    if (PAGES.length < 2) return;
    pageIdx = (pageIdx + 1) % PAGES.length;
    render(false);
  }, CONFIG.SEGUNDOS_POR_PAGINA * 1e3);
}

/* ---------- Reloj ---------- */
let currentDay = todayKey();
function renderClock() {
  const now = new Date(), key = todayKey();
  document.getElementById("clockTime").textContent = fmtTime(now);
  document.getElementById("clockDate").textContent = `${WD_NAMES[(bogota(now).getUTCDay() + 6) % 7]}, ${Number(key.slice(8, 10))} de ${MESES_LARGO[Number(key.slice(5, 7)) - 1]}`;
  if (key !== currentDay) { currentDay = key; if (CONFIG.RELOAD_AT_MIDNIGHT) location.reload(); }
}

/* Escala el diseño de 1920x1080 al tamaño real de la pantalla */
function fitStage() {
  const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById("stage").style.setProperty("--k", String(k));
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", fitStage);
fitStage();
document.documentElement.style.setProperty("--page-seconds", CONFIG.SEGUNDOS_POR_PAGINA + "s");
renderClock();
setInterval(renderClock, 20e3);
loadData().then(startRotation);
setInterval(loadData, CONFIG.REFRESH_MS);
fetchLogos();
</script>
